services:
  - type: web
    name: codechess-hackathon
    runtime: node
    plan: starter
    buildCommand: npm ci --ignore-scripts --workspace @codechess/server --workspace @codechess/shared --include=dev
    startCommand: npm run server
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
